services:
  frontend:
    container_name: frontend
    build:
      context: .
      dockerfile: ./frontend/Dockerfile
    ports:
      - "127.0.0.1:${FRONTEND_PORT}:80"
    environment:
      - FRONTEND_PORT=${FRONTEND_PORT}
      - BACKEND_SERVICE=backend
    networks:
      - frontend_net
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  backend:
    container_name: backend
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS}
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      - RABBITMQ_DEFAULT_USER=${RABBIT_USER}
      - RABBITMQ_DEFAULT_PASS=${RABBIT_PASS}
    ports:
      - "127.0.0.1:${BACKEND_PORT}:8000"
    networks:
      - backend_net
      - frontend_net
      - mq_net
    volumes:
      - ./config:/app/config:ro  
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8000/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  db:
    container_name: postgres
    image: postgres:15-alpine3.23
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    networks:
      - backend_net
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB -h localhost || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  rabbitmq:
    container_name: rabbitmq
    image: rabbitmq:4.2.4-management-alpine
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBIT_USER}
      - RABBITMQ_DEFAULT_PASS=${RABBIT_PASS}
    ports:
      - "127.0.0.1:15672:15672"
    networks:
      - mq_net
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  consumer:
    # deploy:
    #   replicas: 3
    container_name: consumer
    build:
      context: .
      dockerfile: consumer/Dockerfile
    environment:
      - RABBIT_URL=amqp://${RABBIT_USER}:${RABBIT_PASS}@rabbitmq:5672/
      - GITHUB_TOKEN=${GITHUB_TOKEN}
      - QUEUE_NAME=webhook_queue
      - OLLAMA_URL=${OLLAMA_URL:-http://ollama:11434}
    networks:
      - mq_net
      - ai_net
    depends_on:
      rabbitmq:
        condition: service_healthy

  backend-tests:
    build:
      context: .
      dockerfile: tests/Dockerfile
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      - RABBIT_HOST=rabbitmq
      - RABBIT_USER=${RABBIT_USER}
      - RABBIT_PASS=${RABBIT_PASS}
      - PYTHONWARNINGS=ignore::DeprecationWarning
    networks:
      - backend_net
      - mq_net
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    profiles:
      - tests

  smee:
    profiles: ["dev"]
    container_name: smee
    image: node:20-alpine3.23
    command: >
      sh -c "
      npm install -g smee-client &&
      smee --url ${SMEE_URL} --target http://backend:8000/worker/webhook
      "
    networks:
      - backend_net
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy

networks:
  frontend_net:
    driver: bridge
  backend_net:
    driver: bridge
  ai_net:
    driver: bridge
  mq_net:
    driver: bridge

volumes:
  postgres_data:
  rabbitmq_data:
